<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="Imperial Royal monogram">
<defs>
  <linearGradient id="ir-light-foil" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8A6A34"/><stop offset=".28" stop-color="#6E5227"/>
    <stop offset=".56" stop-color="#5B4320"/><stop offset=".80" stop-color="#7A5C2C"/>
    <stop offset="1" stop-color="#4A3518"/>
  </linearGradient>
  <linearGradient id="ir-light-shield" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6E5227" stop-opacity=".16"/>
    <stop offset="1" stop-color="#5B4320" stop-opacity=".04"/>
  </linearGradient>
  <radialGradient id="ir-light-glow" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#6E5227" stop-opacity=".20"/>
    <stop offset="1" stop-color="#6E5227" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- refined shield, double hairline -->
<path d="M120 44 L206 84 V158 C206 212 170 250 120 270 C70 250 34 212 34 158 V84 Z"
      fill="url(#ir-light-shield)" stroke="url(#ir-light-foil)" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M120 53 L197 89 V157 C197 206 164 241 120 260 C76 241 43 206 43 157 V89 Z"
      fill="none" stroke="#8A6A34" stroke-width=".8" opacity=".55"/>
<circle cx="120" cy="148" r="86" fill="url(#ir-light-glow)"/>

<!-- imperial crown -->
<path d="M72 62 L78 26 L100 48 L120 20 L140 48 L162 26 L168 62 Z"
      fill="url(#ir-light-foil)" stroke="#8A6A34" stroke-width="1.1" stroke-linejoin="round"/>
<path d="M72 62 H168" stroke="#8A6A34" stroke-width="1.4"/>
<rect x="70" y="63" width="100" height="9" rx="1.5" fill="url(#ir-light-foil)" stroke="#8A6A34" stroke-width=".8"/>
<circle cx="120" cy="35" r="3.2" fill="#FBF7EC" opacity=".75"/>
<circle cx="82" cy="42" r="2.2" fill="#FBF7EC" opacity=".6"/>
<circle cx="158" cy="42" r="2.2" fill="#FBF7EC" opacity=".6"/>
<path d="M120 20 V44 M78 26 L100 48 M162 26 L140 48" stroke="#FBF7EC" stroke-width=".7" opacity=".32"/>

<!-- hairline rules framing the monogram -->
<path d="M74 96 H166" stroke="#8A6A34" stroke-width=".8" opacity=".7"/>
<path d="M74 208 H166" stroke="#8A6A34" stroke-width=".8" opacity=".7"/>
<circle cx="120" cy="96" r="2" fill="#6E5227"/>
<circle cx="120" cy="208" r="2" fill="#6E5227"/>

<!-- IR monogram: font-independent serif, gold foil -->
<text x="120" y="186" text-anchor="middle" fill="url(#ir-light-foil)"
      font-family="Georgia,'Times New Roman',serif" font-size="104" font-weight="400"
      letter-spacing="-6" style="paint-order:stroke" stroke="#5B4320" stroke-width=".45">IR</text>
<text x="120" y="186" text-anchor="middle" fill="none" stroke="#8A6A34" stroke-width=".35" stroke-opacity=".65"
      font-family="Georgia,'Times New Roman',serif" font-size="104" font-weight="400" letter-spacing="-6">IR</text>

<!-- founding mark -->
<text x="120" y="230" text-anchor="middle" fill="#8A6A34"
      font-family="Georgia,'Times New Roman',serif" font-size="10.5" letter-spacing="3.4">EST · MMXXIV</text>
<path d="M120 240 l5 6 -5 6 -5 -6 Z" fill="url(#ir-light-foil)"/>
</svg>