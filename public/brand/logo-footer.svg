<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" width="660" height="190" role="img" aria-label="Imperial Royal Real Estate">
<defs><linearGradient id="wmfoil-gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#F2E3BE"/><stop offset=".5" stop-color="#D4B36A"/><stop offset="1" stop-color="#E5D1A0"/>
</linearGradient></defs>
<svg xmlns="http://www.w3.org/2000/svg" x="10" y="18" width="132" height="154" viewBox="0 0 240 280">
<defs>
  <linearGradient id="wm-gold-foil" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2E3BE"/><stop offset=".28" stop-color="#D4B36A"/>
    <stop offset=".56" stop-color="#A9823F"/><stop offset=".80" stop-color="#E5D1A0"/>
    <stop offset="1" stop-color="#F7EBCF"/>
  </linearGradient>
  <linearGradient id="wm-gold-shield" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D4B36A" stop-opacity=".16"/>
    <stop offset="1" stop-color="#A9823F" stop-opacity=".04"/>
  </linearGradient>
  <radialGradient id="wm-gold-glow" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#D4B36A" stop-opacity=".20"/>
    <stop offset="1" stop-color="#D4B36A" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- refined shield, double hairline -->
<path d="M120 44 L206 84 V158 C206 212 170 250 120 270 C70 250 34 212 34 158 V84 Z"
      fill="url(#wm-gold-shield)" stroke="url(#wm-gold-foil)" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M120 53 L197 89 V157 C197 206 164 241 120 260 C76 241 43 206 43 157 V89 Z"
      fill="none" stroke="#D9BC78" stroke-width=".8" opacity=".55"/>
<circle cx="120" cy="148" r="86" fill="url(#wm-gold-glow)"/>

<!-- imperial crown -->
<path d="M72 62 L78 26 L100 48 L120 20 L140 48 L162 26 L168 62 Z"
      fill="url(#wm-gold-foil)" stroke="#F2E3BE" stroke-width="1.1" stroke-linejoin="round"/>
<path d="M72 62 H168" stroke="#F2E3BE" stroke-width="1.4"/>
<rect x="70" y="63" width="100" height="9" rx="1.5" fill="url(#wm-gold-foil)" stroke="#F2E3BE" stroke-width=".8"/>
<circle cx="120" cy="35" r="3.2" fill="#0A0C12" opacity=".75"/>
<circle cx="82" cy="42" r="2.2" fill="#0A0C12" opacity=".6"/>
<circle cx="158" cy="42" r="2.2" fill="#0A0C12" opacity=".6"/>
<path d="M120 20 V44 M78 26 L100 48 M162 26 L140 48" stroke="#0A0C12" stroke-width=".7" opacity=".32"/>

<!-- hairline rules framing the monogram -->
<path d="M74 96 H166" stroke="#D9BC78" stroke-width=".8" opacity=".7"/>
<path d="M74 208 H166" stroke="#D9BC78" stroke-width=".8" opacity=".7"/>
<circle cx="120" cy="96" r="2" fill="#D4B36A"/>
<circle cx="120" cy="208" r="2" fill="#D4B36A"/>

<!-- IR monogram: font-independent serif, gold foil -->
<text x="120" y="186" text-anchor="middle" fill="url(#wm-gold-foil)"
      font-family="Georgia,'Times New Roman',serif" font-size="104" font-weight="400"
      letter-spacing="-6" style="paint-order:stroke" stroke="#A9823F" stroke-width=".45">IR</text>
<text x="120" y="186" text-anchor="middle" fill="none" stroke="#F2E3BE" stroke-width=".35" stroke-opacity=".65"
      font-family="Georgia,'Times New Roman',serif" font-size="104" font-weight="400" letter-spacing="-6">IR</text>

<!-- founding mark -->
<text x="120" y="230" text-anchor="middle" fill="#D9BC78"
      font-family="Georgia,'Times New Roman',serif" font-size="10.5" letter-spacing="3.4">EST · MMXXIV</text>
<path d="M120 240 l5 6 -5 6 -5 -6 Z" fill="url(#wm-gold-foil)"/>
</svg>
<path d="M154 45.6 V144.4" stroke="#D9BC78" stroke-width="1" opacity=".55"/>
<text x="168" y="89.3" fill="#F4F0E7" font-family="Georgia,'Times New Roman',serif" font-size="47" letter-spacing="7">IMPERIAL</text>
<text x="170" y="133.0" fill="url(#wmfoil-gold)" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="47" letter-spacing="9">ROYAL</text>
<text x="170" y="163.4" fill="#A9ADB7" font-family="Georgia,'Times New Roman',serif" font-size="11" letter-spacing="5.2">REAL ESTATE · PRIVATE RESIDENCES</text>
</svg>